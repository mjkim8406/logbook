[project]
name = "logbook-mcp"
version = "0.1.0"
description = "MCP server for the logbook markdown vault"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2.3,<3"]

[project.scripts]
logbook-mcp = "logbook_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logbook_mcp"]
